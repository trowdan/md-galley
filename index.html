<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookwright</title>

    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/manuscript.css">
    <link rel="stylesheet" href="styles/chrome.css">
    <link rel="stylesheet" href="styles/marginalia.css">
    <link rel="stylesheet" href="styles/palette.css">
    <link rel="stylesheet" href="styles/gate.css">
</head>

<body>
    <div id="gate" class="gate" hidden></div>

    <header id="chrome" class="chrome" hidden>
        <div class="chrome__left">
            <button class="chrome__brand" id="brand" title="Open command palette">Bookwright</button>
            <span class="chrome__sep" aria-hidden="true">·</span>
            <span class="chrome__file" id="chrome-file">no file open</span>
        </div>
        <div class="chrome__right">
            <button class="chrome__cmd" id="open-palette" title="Open command palette (⌘K)">
                <svg class="chrome__cmd-svg" viewBox="0 0 14 14" aria-hidden="true">
                    <rect x="2" y="2" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.1"/>
                    <line x1="2" y1="5.4" x2="12" y2="5.4" stroke="currentColor" stroke-width="1.1"/>
                    <circle cx="4" cy="3.7" r="0.55" fill="currentColor"/>
                </svg>
                <span class="chrome__cmd-key">(⌘K)</span>
            </button>
            <button class="chrome__cmd" id="open-workspace" title="Open workspace (⌘O)">
                <svg class="chrome__cmd-svg" viewBox="0 0 14 14" aria-hidden="true">
                    <path d="M1.5 4.2 V 11 a 0.8 0.8 0 0 0 0.8 0.8 H 11.7 a 0.8 0.8 0 0 0 0.8 -0.8 V 5 a 0.8 0.8 0 0 0 -0.8 -0.8 H 6.5 L 5.2 2.7 a 0.8 0.8 0 0 0 -0.6 -0.3 H 2.3 a 0.8 0.8 0 0 0 -0.8 0.8 Z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
                </svg>
                <span class="chrome__cmd-key">(⌘O)</span>
            </button>
            <button class="chrome__cmd" id="toggle-theme" title="Toggle theme">
                <span class="chrome__cmd-glyph" aria-hidden="true">◐</span>
            </button>
            <div class="chrome__menu-host">
                <button class="chrome__cmd" id="open-settings" title="Settings"
                        aria-haspopup="menu" aria-expanded="false">
                    <span class="chrome__cmd-glyph" aria-hidden="true">⚙</span>
                </button>
                <div id="settings-menu" class="settings-menu" role="menu" hidden>
                    <button class="settings-menu__item" data-action="reset" type="button" role="menuitem">
                        <span class="settings-menu__glyph" aria-hidden="true">↻</span>
                        <span class="settings-menu__label">reset bookwright</span>
                        <span class="settings-menu__hint">erases notes, theme, .bookwright folder</span>
                    </button>
                </div>
            </div>
            <button class="chrome__action" id="export-review" disabled>export 0</button>
        </div>
    </header>

    <nav id="filter-strip" class="filter-strip" aria-label="Filter notes by status" hidden>
        <div class="filter-strip__inner">
            <span class="filter-strip__label">filter</span>
            <button data-filter="open" aria-pressed="true">open</button>
            <button data-filter="resolved">resolved</button>
            <button data-filter="all">all</button>
            <span class="filter-strip__sep" aria-hidden="true">·</span>
            <span class="filter-strip__pass" id="filter-strip-pass" data-state="none"></span>
        </div>
    </nav>

    <main id="app-shell" class="app-shell" hidden>
        <article id="manuscript" class="manuscript" data-show-lines="false" data-filter="open">
            <div id="manuscript-text" class="manuscript__text"></div>
            <div id="manuscript-gutter" class="manuscript__gutter"></div>
        </article>
    </main>

    <dialog id="palette" class="palette">
        <div class="palette__head">
            <input id="palette-search" class="palette__search"
                   placeholder="open chapter, file, or section" autocomplete="off">
            <kbd class="palette__hint">esc</kbd>
        </div>
        <ol id="palette-list" class="palette__list"></ol>
        <div class="palette__footer">
            <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span>
            <span><kbd>↵</kbd> open</span>
            <span><kbd>⌘O</kbd> workspace</span>
            <span><kbd>esc</kbd> close</span>
        </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
